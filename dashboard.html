<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; padding:20px; color:#333; }
.container { max-width:1000px; margin:0 auto; }
h1 { color:#fff; text-align:center; margin-bottom:20px; font-size:28px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:25px; }
.card,.panel { background:#fff; border-radius:15px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.2); }
.card { text-align:center; }
.panel { margin-bottom:25px; }
.panel h2 { font-size:18px; margin-bottom:15px; color:#444; }
.label { font-size:13px; color:#888; text-transform:uppercase; letter-spacing:1px; }
.value { font-size:42px; font-weight:bold; margin:8px 0; color:#667eea; }
.value.hot { color:#dc3545; }
.unit { font-size:16px; color:#aaa; }
.badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; }
.on { background:#d4edda; color:#155724; } .off { background:#f8d7da; color:#721c24; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
input { padding:10px; border:1px solid #ccc; border-radius:8px; font-size:14px; }
.btn { padding:11px 24px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; color:#fff; }
.g { background:#28a745; } .r { background:#dc3545; } .p { background:#667eea; }
#alertBox { display:none; background:#dc3545; color:#fff; padding:14px 20px; border-radius:12px; margin-bottom:20px; font-weight:600; }
table { width:100%; border-collapse:collapse; }
th,td { padding:9px; text-align:left; border-bottom:1px solid #eee; font-size:14px; }
th { background:#f8f9fa; color:#666; text-transform:uppercase; font-size:12px; }
#log { background:#1e1e1e; color:#0f0; font-family:monospace; padding:15px; border-radius:10px; max-height:180px; overflow-y:auto; font-size:13px; line-height:1.6; }
#log .error { color:#f66; } #log .info { color:#6af; } #log .warn { color:#fc3; }
</style>
</head>
<body>
<div class="container">
  <h1>🌡️ IoT Dashboard — REST API</h1>
  <div id="alertBox"></div>

  <div class="cards">
    <div class="card"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
    <div class="card"><div class="label">Status Sensor</div><div class="value" style="font-size:22px"><span class="badge off" id="badge">OFFLINE</span></div>
      <div class="unit" id="mode">mode: -</div></div>
    <div class="card"><div class="label">Batas Suhu</div><div class="value" id="thNow" style="font-size:34px">--</div><div class="unit">°C</div></div>
  </div>

  <div class="panel">
    <h2>🔑 Pengaturan & Batas Suhu</h2>
    <div class="row">
      <input id="apiKey" placeholder="X-API-Key" style="width:200px">
      <input id="thInput" type="number" step="0.1" placeholder="Batas suhu (°C)" style="width:170px">
      <button class="btn p" onclick="setThreshold()">Set Batas (PUT)</button>
    </div>
  </div>

  <div class="panel">
    <h2>📈 Grafik Real-time</h2>
    <canvas id="chart" height="110"></canvas>
  </div>

  <div class="panel">
    <h2>💡 Kontrol Perangkat</h2>
    <div class="row">
      <button class="btn g" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn r" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <div class="panel">
    <h2>🗂️ 10 Data Sensor Terakhir (dari SQLite)</h2>
    <table><thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
    <tbody id="hist"><tr><td colspan="3" style="text-align:center;color:#999">Loading...</td></tr></tbody></table>
  </div>

  <div class="panel"><h2>📝 Log Aktivitas</h2><div id="log"></div></div>
</div>

<script>
// ===== KONFIGURASI =====
const ORIGIN = location.protocol.startsWith('http') ? location.origin : 'http://localhost:1880';
const API = ORIGIN + '/api';
const WS_URL = ORIGIN.replace(/^http/, 'ws') + '/ws/sensor';
const MAX = 50;
let threshold = null, wsOpen = false, lastSeen = 0, lastReceived = '';
let rows = [];

// ===== UTIL =====
const $ = id => document.getElementById(id);
function log(msg, type = 'info') {
  const el = $('log');
  el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function getKey() { return $('apiKey').value.trim(); }
try { $('apiKey').value = localStorage.getItem('apiKey') || 'iot-kampus-2026'; } catch (e) { $('apiKey').value = 'iot-kampus-2026'; }
$('apiKey').addEventListener('change', () => { try { localStorage.setItem('apiKey', getKey()); } catch (e) {} });

async function api(path, opt = {}) {
  const res = await fetch(API + path, { ...opt, headers: { 'Content-Type': 'application/json', 'X-API-Key': getKey() } });
  const json = await res.json();
  if (res.status === 401) log('✗ 401 Unauthorized: cek X-API-Key', 'error');
  return json;
}

// ===== CHART.JS =====
const chart = new Chart($('chart'), {
  type: 'line',
  data: { labels: [], datasets: [
    { label: 'Suhu (°C)', data: [], borderColor: '#667eea', backgroundColor: '#667eea33', tension: .3, yAxisID: 'y' },
    { label: 'Kelembaban (%)', data: [], borderColor: '#17a2b8', tension: .3, yAxisID: 'y1' },
    { label: 'Batas Suhu', data: [], borderColor: '#dc3545', borderDash: [6, 4], pointRadius: 0, yAxisID: 'y' }
  ]},
  options: { animation: false, scales: {
    y: { title: { display: true, text: '°C' } },
    y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '%' } } } }
});
function addPoint(d) {
  const c = chart.data;
  c.labels.push(new Date(d.received).toLocaleTimeString());
  c.datasets[0].data.push(d.suhu);
  c.datasets[1].data.push(d.kelembaban);
  c.datasets[2].data.push(threshold);
  if (c.labels.length > MAX) { c.labels.shift(); c.datasets.forEach(s => s.data.shift()); }
  chart.update();
}
function setThresholdUI(t) {
  threshold = t;
  $('thNow').textContent = t;
  chart.data.datasets[2].data = chart.data.datasets[2].data.map(() => t);
  chart.update();
}

// ===== UPDATE UI =====
function showReading(d) {
  $('suhu').textContent = d.suhu;
  $('suhu').classList.toggle('hot', !!d.over);
  $('kelembaban').textContent = d.kelembaban;
  lastSeen = Date.now();
}
function renderTable() {
  $('hist').innerHTML = rows.slice(-10).reverse().map(d =>
    `<tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('')
    || '<tr><td colspan="3" style="text-align:center;color:#999">Belum ada data</td></tr>';
}
function onData(d) {
  if (d.received === lastReceived) return;
  lastReceived = d.received;
  if (d.threshold !== undefined && d.threshold !== threshold) setThresholdUI(d.threshold);
  showReading(d); addPoint(d);
  rows.push(d); if (rows.length > MAX) rows.shift();
  renderTable();
}
function onAlert(a) {
  const box = $('alertBox');
  box.style.display = 'block';
  box.textContent = '⚠️ ' + a.message;
  log('⚠ NOTIFIKASI: ' + a.message, 'warn');
  if ('Notification' in window && Notification.permission === 'granted') new Notification('IoT Alert', { body: a.message });
}
setInterval(() => {
  const online = Date.now() - lastSeen < 10000;
  $('badge').textContent = online ? 'ONLINE' : 'OFFLINE';
  $('badge').className = 'badge ' + (online ? 'on' : 'off');
  $('mode').textContent = 'mode: ' + (wsOpen ? 'WebSocket' : 'polling (fallback)');
  if (online && threshold !== null && parseFloat($('suhu').textContent) <= threshold) $('alertBox').style.display = 'none';
}, 1000);

// ===== REST: data awal, kontrol, threshold =====
async function loadInitial() {
  try {
    const s = await api('/suhu');
    if (s.threshold !== undefined) setThresholdUI(s.threshold);
    const h = await api('/history');
    (h.data || []).forEach(d => { rows.push(d); addPoint(d); lastReceived = d.received; });
    renderTable();
    if (s.data && s.data.suhu !== null) { showReading(s.data); }
    log(`Data awal dimuat (${(h.data || []).length} riwayat)`);
  } catch (e) { log('Gagal memuat data awal: ' + e.message, 'error'); }
}
async function kontrol(device, action) {
  try {
    const j = await api('/kontrol', { method: 'POST', body: JSON.stringify({ device, action }) });
    j.status === 'success' ? log(`✓ Perintah terkirim: ${device} → ${action}`) : log('✗ Gagal: ' + j.message, 'error');
  } catch (e) { log('✗ Error kontrol: ' + e.message, 'error'); }
}
async function setThreshold() {
  const batas = parseFloat($('thInput').value);
  try {
    const j = await api('/threshold', { method: 'PUT', body: JSON.stringify({ batas }) });
    if (j.status === 'success') { setThresholdUI(j.batas); log('✓ Batas suhu diset: ' + j.batas + '°C'); }
    else log('✗ ' + j.message, 'error');
  } catch (e) { log('✗ Error threshold: ' + e.message, 'error'); }
}

// ===== WEBSOCKET (tanpa polling) + fallback =====
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsOpen = true; log('WebSocket terhubung: ' + WS_URL); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'sensor') onData(m.data);
    else if (m.type === 'alert') onAlert(m);
  };
  ws.onclose = () => { wsOpen = false; log('WebSocket terputus, mencoba lagi 3 detik...', 'error'); setTimeout(connectWS, 3000); };
  ws.onerror = () => ws.close();
}
setInterval(async () => {            // fallback hanya jika WebSocket mati
  if (wsOpen) return;
  try { const s = await api('/suhu'); if (s.data && s.data.suhu !== null) onData(s.data); } catch (e) {}
}, 3000);

if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
log('Dashboard dimulai');
loadInitial().then(connectWS);
</script>
</body>
</html>
